  - 1.6 GB

formats: [application/pdf, application/msword, text/csv, application/vnd.ms-excel, application/zip]

fundingReferences: []   # none

# --- notes for the deposit form -------------------------------------------
notes: |
  openICPSR: 30 GB and 1,000 files per deposit, so upload the single zip rather
  than the unpacked tree. Choose a CC0 licence and the "uncurated / self-deposit"
  option unless full ICPSR curation is wanted.

  Harvard Dataverse: 2.5 GB per file, so the 1.6 GB zip uploads directly. Turn
  OFF automatic unzipping, or Dataverse will create 3,995 individual file
  entries.

  Zenodo: fits well within 50 GB, but the default limit is 100 files per record,
  so the zip is required rather than optional.
