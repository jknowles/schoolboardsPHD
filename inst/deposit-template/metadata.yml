# Deposit metadata for the source-records archive.
#
# Field names follow the DataCite 4.x schema, which is what openICPSR, Harvard
# Dataverse and Zenodo all map their forms onto. Copy the values across; nothing
# here needs to be uploaded as a file.
#
# Fill in `doi:` once the repository assigns one, then run
#   scripts/record-deposit-doi.sh <doi>
# in the software repository to propagate it into CITATION.cff, README.md and
# data/provenance/README.md.

doi: ~   # assigned on publication

title: >-
  Source records for School Boards and the Democratic Promise:
  Wisconsin school board elections, 2002-2012

creators:
  - name: Knowles, Jared E.
    givenName: Jared E.
    familyName: Knowles
    affiliation: Civilytics Consulting LLC
    # orcid: 0000-0000-0000-0000   # add if you have one

publicationYear: 2026
resourceType: Dataset
resourceTypeGeneral: Dataset
language: eng
version: "1.0"

description: |
  Primary source material underlying "School Boards and the Democratic Promise"
  (PhD dissertation, University of Wisconsin-Madison, 2015), a study of school
  board elections across Wisconsin from 2002 to 2012.

  The collection is the evidence layer beneath the dissertation's datasets:
  approximately one thousand scanned statements of the board of canvassers and
  clerk responses obtained by public records request from 314 Wisconsin school
  districts and their county clerks, together with the agency records and raw
  statistical files from which the analysis variables were constructed.

  It is deposited for verification rather than convenience. The transcribed
  election-result CSVs, the analysis code, and a containerised build that
  reproduces the dissertation's results are maintained separately in the
  software repository listed under relatedIdentifiers; nothing in this archive
  is required to run that analysis. What this archive supports is checking it.

  Contents: per-district scanned election records and transcribed CSVs (1.1 GB);
  Wisconsin Employment Relations Commission union recertification election
  records 2002-2013 (85 MB); election data, High School Completion files,
  revenue limits and ward geometry (399 MB); 2000 Census election and geography
  crosswalks; teacher and staff counts; Government Accountability Board voter
  and candidate counts; Wisconsin Association of School Boards report material;
  and teacher contract choices following 2011 Act 10.

  Note for reusers: the scanned PDFs are images and carry no text layer. They
  cannot be searched or parsed without OCR, which is why the dissertation
  transcribed them by hand.

methods: |
  Records were assembled between 2012 and 2014, principally by individual public
  records requests to Wisconsin school districts and county clerks, each released
  by the responsible records custodian. Agency material was obtained from the
  Wisconsin Department of Public Instruction, the Employment Relations
  Commission, the Government Accountability Board and the Department of
  Administration, supplemented with U.S. Census and NCES district data.

  All records are public. No individual-level voter data is included: the
  Government Accountability Board and Department of Administration files are
  aggregate counts by municipality, ward or school district.

  157 files of editor state (.Rproj.user caches, .Rhistory, .RData, .Rproj) were
  removed before deposit. Nothing else was withheld, redacted or altered. A
  SHA-256 for every one of the 3,995 files is in MANIFEST.sha256; the 320
  transcribed CSVs match the software repository byte-for-byte.

subjects:
  - school board elections
  - local elections
  - education politics
  - Wisconsin
  - voter turnout
  - candidate emergence
  - 2011 Wisconsin Act 10
  - collective bargaining
  - public records
  - education policy

